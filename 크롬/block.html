<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --accent: #FFB020; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    background: #000000; color: #FFFFFF;
    font-family: 'Pretendard', sans-serif;
  }
  .card {
    width: 420px; max-width: calc(100vw - 32px); text-align: center; padding: 44px 36px 36px;
    background: #0B0B0B; border: 1px solid #1F1F1F; border-radius: 28px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .quote-box, .focus-box { border-radius: 16px !important; }
  .game-input, .unlock-btn { border-radius: 12px !important; }
  .time-setting-box { border-radius: 14px !important; }
  #unlockDuration { border-radius: 10px !important; }
  .icon {
    width: 56px; height: 56px; margin: 0 auto 24px; border-radius: 50%;
    background: rgba(255, 176, 32, 0.1); border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 22px;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.3px; }
  p.sub { font-size: 14px; color: #8A8A8A; margin: 0 0 32px; line-height: 1.5; }
  .quote-box {
    background: #111111; border: 1px solid #2A2A2A; padding: 16px 18px;
    border-radius: 10px; font-size: 13px; color: #B5B5B5; margin-bottom: 32px;
    line-height: 1.6; text-align: left;
  }
  .game-box { margin-bottom: 20px; }
  .game-label { font-size: 12px; color: #8A8A8A; margin-bottom: 10px; }
  .game-label strong { color: #FFFFFF; font-weight: 700; }
  .game-input {
    width: 100%; padding: 13px; background: #000000; border: 1px solid #3A3A3A;
    border-radius: 8px; color: #FFFFFF; font-size: 16px; text-align: center; outline: none;
    font-family: 'Pretendard', sans-serif; letter-spacing: 2px;
  }
  .game-input:focus { border-color: var(--accent); }
  .unlock-btn {
    width: 100%; padding: 14px; margin-top: 14px; background: #FFFFFF; color: #000000;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: 'Pretendard', sans-serif; transition: opacity 0.15s, background 0.15s;
  }
  .unlock-btn:hover { background: var(--accent); opacity: 1; }
  .error-msg {
    font-size: 12px; color: #FFFFFF; margin-top: 10px; height: 14px;
    opacity: 0; transition: opacity 0.15s;
  }
  .error-msg.show { opacity: 1; }
  .back-link {
    display: inline-block; margin-top: 22px; font-size: 12px; color: #6A6A6A;
    text-decoration: none; cursor: pointer;
  }
  .back-link:hover { color: #B5B5B5; }
  .strict-note {
    margin-top: 22px; font-size: 11.5px; color: #4E4E4E;
  }
  .focus-box {
    display: none; background: #111111; border: 1px solid var(--accent);
    border-radius: 10px; padding: 18px; margin-bottom: 8px;
  }
  .focus-label { font-size: 12px; color: #8A8A8A; margin: 0 0 6px; }
  .focus-remaining {
    font-size: 32px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums; letter-spacing: 1px;
  }
  .focus-desc { font-size: 12px; color: #6A6A6A; margin: 8px 0 0; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fa-solid fa-hand"></i></div>
    <h1 id="siteTitle">접속이 제한된 사이트입니다</h1>
    <p class="sub" id="targetInfo">지금 이 순간 집중이 더 중요합니다.</p>

    <div class="quote-box" id="quoteBox"></div>

    <div class="focus-box" id="focusBox">
      <p class="focus-label">집중 세션 종료까지</p>
      <div class="focus-remaining" id="focusRemaining">--:--</div>
      <p class="focus-desc" id="focusDesc">집중 세션 중에는 숫자 게임으로도 해제할 수 없어요.</p>
    </div>

    <div class="game-box" id="gameBox">
      <p class="game-label">아래칸에 숫자를 거꾸로 입력하세요&nbsp; <strong id="targetNum">···</strong></p>
      <input type="text" id="gameInput" class="game-input" placeholder="입력하기" autocomplete="off" inputmode="numeric">
      <div class="error-msg" id="errorMsg">틀렸습니다. 다시 시도하세요.</div>
    </div>

    <div class="time-setting-box" id="timeSettingBox" style="margin-bottom: 16px; text-align: left; background: #141414; padding: 12px 14px; border-radius: 10px; border: 1.5px solid #2E2E2E;">
      <label for="unlockDuration" style="font-size: 12.5px; color: #ABABAB; font-weight: 600; display: block; margin-bottom: 6px;">이후 허용 시간 유지</label>
      <select id="unlockDuration" style="width: 100%; padding: 10px; background: #0A0A0A; border: 1.5px solid #3E3E3E; border-radius: 8px; color: #FFFFFF; font-size: 13.5px; outline: none; font-family: 'Pretendard', sans-serif; font-weight: 600; cursor: pointer;">
        <option value="3">3분 동안 차단 안 함</option>
        <option value="5" selected>5분 동안 차단 안 함</option>
        <option value="10">10분 동안 차단 안 함</option>
        <option value="30">30분 동안 차단 안 함</option>
      </select>
    </div>

    <button id="unlockBtn" class="unlock-btn">사이트로 이동하기</button>
    <a class="back-link" id="backLink">이전 페이지로 돌아가기</a>
    <p class="strict-note" id="strictNote" style="display:none;">엄격 모드가 켜져 있어 되돌아갈 수 없습니다</p>
  </div>

  <script src="block.js"></script>
</body>
</html>
